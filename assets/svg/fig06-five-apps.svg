<text x="416" y="180" class="b" text-anchor="middle">既有争论</text>
<text x="416" y="200" class="s" text-anchor="middle">分析还原论</text>
<line x1="454" y1="120" x2="546" y2="120" stroke="#666666" stroke-width="1.4"/><polygon points="546,120 539,123 539,117" fill="#666666"/>
<circle cx="584" cy="120" r="34" fill="#c94f4f" fill-opacity="0.12" stroke="#c94f4f" stroke-width="1.8"/>
