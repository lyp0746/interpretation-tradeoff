<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
<style>text{font-family:"Microsoft YaHei","SimHei",Arial,sans-serif;}.t{font-size:18px;fill:#222222;}.s{font-size:14px;fill:#555555;}.b{font-size:15px;font-weight:700;}.cap{font-size:16px;fill:#555555;}</style>
<rect x="0" y="0" width="820" height="360" fill="#ffffff"/>
<text x="410" y="32" class="t" text-anchor="middle">容量级联：四层的可核对性递减</text>
<rect x="60" y="66" width="210" height="50" rx="6" fill="#3a6ea5" fill-opacity="0.12" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="76" y="88" class="b" fill="#3a6ea5">L1 观察</text>
<text x="76" y="107" class="s">文献说了什么</text>
<rect x="300" y="76" width="380" height="30" rx="4" fill="#3a6ea5" fill-opacity="0.55"/>
<text x="690" y="96" class="s">95%</text>
<rect x="60" y="134" width="210" height="50" rx="6" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.4"/>
<text x="76" y="156" class="b" fill="#009E73">L2 推理</text>
<text x="76" y="175" class="s">它意味着什么</text>
<rect x="300" y="144" width="280" height="30" rx="4" fill="#009E73" fill-opacity="0.55"/>
<text x="590" y="164" class="s">70%</text>
<rect x="60" y="202" width="210" height="50" rx="6" fill="#b8862f" fill-opacity="0.12" stroke="#b8862f" stroke-width="1.4"/>
<text x="76" y="224" class="b" fill="#b8862f">L3 诠释</text>
<text x="76" y="243" class="s">意图与时代逻辑</text>
<rect x="300" y="212" width="160" height="30" rx="4" fill="#b8862f" fill-opacity="0.55"/>
<text x="470" y="232" class="s">40%</text>
<rect x="60" y="270" width="210" height="50" rx="6" fill="#c94f4f" fill-opacity="0.12" stroke="#c94f4f" stroke-width="1.4"/>
<text x="76" y="292" class="b" fill="#c94f4f">L4 因果</text>
<text x="76" y="311" class="s">它导致了什么</text>
<rect x="300" y="280" width="60" height="30" rx="4" fill="#c94f4f" fill-opacity="0.55"/>
<text x="370" y="300" class="s">15%</text>
<text x="560" y="200" class="s" transform="rotate(90 560 200)">解释自由度递增 →</text>
<text x="160" y="342" class="cap" text-anchor="middle">越往上，可核对性越低；用 L1 的语气说 L4 的话，就是错配</text>
</svg>
