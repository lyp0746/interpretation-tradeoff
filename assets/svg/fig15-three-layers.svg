<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
<style>text{font-family:"Microsoft YaHei","SimHei",Arial,sans-serif;}.t{font-size:17px;fill:#222222;font-weight:700;}.b{font-size:14px;fill:#222222;font-weight:700;}.s{font-size:12px;fill:#555555;}.cap{font-size:13px;fill:#555555;}</style>
<rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
<text x="380.0" y="28" class="t" text-anchor="middle">地板、天花板、阁楼：三层强度的递进</text>
<rect x="110" y="70" width="540" height="56" rx="8" fill="#c94f4f" fill-opacity="0.12" stroke="#c94f4f" stroke-width="1.6"/>
<text x="380.0" y="94" class="b" fill="#c94f4f" text-anchor="middle">阁楼（推测）</text>
<text x="380.0" y="114" class="s" text-anchor="middle">坐标可形式化、可自动化</text>
<rect x="166" y="144" width="428" height="56" rx="8" fill="#b8862f" fill-opacity="0.12" stroke="#b8862f" stroke-width="1.6"/>
<text x="380.0" y="168" class="b" fill="#b8862f" text-anchor="middle">天花板（有条件）</text>
<text x="380.0" y="188" class="s" text-anchor="middle">置信度分配可跨立场、跨传统统一使用</text>
<rect x="222" y="218" width="316" height="56" rx="8" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.6"/>
<text x="380.0" y="242" class="b" fill="#009E73" text-anchor="middle">地板（保底）</text>
<text x="380.0" y="262" class="s" text-anchor="middle">分层标注的做法有用（独立成立）</text>
<line x1="70" y1="290" x2="690" y2="290" stroke="#666666" stroke-width="1" opacity="0.5"/>
<text x="380.0" y="308" class="cap" text-anchor="middle">撤回“阁楼”只伤天花板，不伤地板；若地板不成立，上面两层一起失效</text>
</svg>
