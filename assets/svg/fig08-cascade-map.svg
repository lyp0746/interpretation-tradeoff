<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
<style>text{font-family:"Microsoft YaHei","SimHei",Arial,sans-serif;}.t{font-size:17px;fill:#222222;font-weight:700;}.b{font-size:14px;fill:#222222;font-weight:700;}.s{font-size:12px;fill:#555555;}.cap{font-size:13px;fill:#555555;}</style>
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440.0" y="28" class="t" text-anchor="middle">从置信度分布到坐标位置：粗粒化，不可反推</text>
<rect x="60" y="70" width="260" height="46" rx="6" fill="#3a6ea5" fill-opacity="0.10" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="76" y="99" class="b">高浓度在 L4</text>
<line x1="330" y1="93" x2="430" y2="93" stroke="#666666" stroke-width="1.4"/><polygon points="430,93 423,96 423,90" fill="#666666"/>
<text x="450" y="99" class="b" fill="#3a6ea5">→ 高 C / 低 T</text>
<rect x="60" y="136" width="260" height="46" rx="6" fill="#009E73" fill-opacity="0.10" stroke="#009E73" stroke-width="1.4"/>
<text x="76" y="165" class="b">分散在 L2–L3</text>
<line x1="330" y1="159" x2="430" y2="159" stroke="#666666" stroke-width="1.4"/><polygon points="430,159 423,162 423,156" fill="#666666"/>
<text x="450" y="165" class="b" fill="#009E73">→ 高 A / 低 C</text>
<rect x="60" y="202" width="260" height="46" rx="6" fill="#b8862f" fill-opacity="0.10" stroke="#b8862f" stroke-width="1.4"/>
<text x="76" y="231" class="b">压在 L1 细节</text>
<line x1="330" y1="225" x2="430" y2="225" stroke="#666666" stroke-width="1.4"/><polygon points="430,225 423,228 423,222" fill="#666666"/>
<text x="450" y="231" class="b" fill="#b8862f">→ 高 T / 低 C</text>
<rect x="620" y="88" width="210" height="150" rx="8" fill="#666666" fill-opacity="0.08" stroke="#666666" stroke-width="1.3"/>
<text x="725" y="150" class="b" text-anchor="middle">多个分布</text>
<text x="725" y="172" class="b" text-anchor="middle">→ 同一坐标</text>
<text x="725" y="200" class="s" text-anchor="middle">（多对一）</text>
<text x="440.0" y="300" class="cap" text-anchor="middle">知道“它是清晰论”，不等于知道它的四层分布；坐标不能反推剖面</text>
</svg>
